<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Rolas</title>
  <link rel="stylesheet" href="styles7.css">
</head>
<body>

<header class="navbar">
  <div class="logo">MIS GUSTOS MUSICALES</div>
  <nav>
    <a href="index.html">INICIO</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Mi música favorita</h1>
    <p>
      Una pequeña colección de canciones que me gusta escuchar.
    </p>
  </div>
</section>

<section class="album">
  <div class="music-card">
    <img src="imagenes/nirvana.jpg">
    <h3>Come As You Are</h3>
    <audio controls>
      <source src="musica/Nirvana  Come As You Are (Official Music Video).mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="music-card">
    <img src="imagenes/eminem.jpg">
    <h3>Bad Meets Evil</h3>
    <audio controls>
      <source src="musica/Bad Meets Evil - Fast Lane ft. Eminem, Royce Da 5'9-null.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="music-card">
    <img src="imagenes/phonk.jpg">
    <h3>Interworld Metamorphosis</h3>
    <audio controls>
      <source src="musica/INTERWORLD METAMORPHOSIS.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="music-card">
    <img src="imagenes/zxmyr.jpg">
    <h3>Zxamyr x Sandro Malandro</h3>
    <audio controls>
      <source src="musica/Zxmyr x Sandro Malandro  Las Horas Pasan.mp3" type="audio/mpeg">
    </audio>
  </div>
</section>

</body>
</html>
